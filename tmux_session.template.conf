# =========================================================
# tmux session template for ROS manual startup
# 特点：
# - 不自动按回车，所有命令只写入 pane 输入缓冲区
# - 若会话已存在，不重复创建
# - 只创建一个窗口，并拆分为多个 pane
# - 对需要进入工作目录并执行 sds 的 pane，命令已写好
# =========================================================

# -------------------------
# 基本参数（按需修改）
# -------------------------
set-environment -g SESSION_NAME sim
set-environment -g WINDOW_NAME manual
set-environment -g WORKDIR ~/simulation_framework

# -------------------------
# 如果会话已存在，直接提示
# -------------------------
if-shell "tmux has-session -t sim 2>/dev/null" \
  "display-message 'Session sim already exists. Attach with: tmux attach -t sim'" \
  "new-session -d -s sim -n manual"

# -------------------------
# Pane 0 : realsense 驱动
# -------------------------
send-keys -t sim:manual.0 "roslaunch realsense2_camera my_d400_and_t265.launch"

# -------------------------
# Pane 1 : dashgo driver
# -------------------------
split-window -v -t sim:manual.0
send-keys -t sim:manual.1 "roslaunch dashgo_driver driver.launch"

# -------------------------
# Pane 2 : umap experiment
# -------------------------
split-window -h -t sim:manual.0
send-keys -t sim:manual.2 "cd ~/simulation_framework && sds && roslaunch umap experiment.launch"

# -------------------------
# Pane 3 : umap detailed_match (sim:=false)
# -------------------------
split-window -v -t sim:manual.2
send-keys -t sim:manual.3 "cd ~/simulation_framework && sds && roslaunch umap detailed_match.launch sim:=false"

# -------------------------
# Pane 4 : t265 baselink
# -------------------------
split-window -h -t sim:manual.1
send-keys -t sim:manual.4 "cd ~/simulation_framework && sds && rosrun umap t265_baselink.py"

# -------------------------
# Pane 5 : mpc real
# -------------------------
split-window -v -t sim:manual.4
send-keys -t sim:manual.5 "cd ~/simulation_framework && sds && roslaunch mpc_nav mpc_real.launch cmd_vel_topic:=/smoother_cmd_vel use_doa_adapter:=true"

# -------------------------
# 自动整理布局
# 可选：even-horizontal / even-vertical / tiled / main-horizontal / main-vertical
# -------------------------
select-layout -t sim:manual tiled

# -------------------------
# 默认聚焦到第一个 pane
# -------------------------
select-pane -t sim:manual.0

# -------------------------
# 给出提示信息
# -------------------------
display-message "tmux session 'sim' is ready. Commands are loaded but NOT executed."



#################################################
# tmux source-file ./tmux_session.template.conf #
# tmux attach -t sim                            #
#################################################