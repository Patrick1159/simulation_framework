rate_hz: 10.0

# MPC horizon
dt: 0.1
N: 45

# Control limits
v_min: -0.1
v_max: 0.4
w_max: 1.2
a_v_max: 0.5       # optional accel limit
a_w_max: 2.0

# Robot / safety
robot_radius: 0.18
safety_margin: 0.15
hard_safety_margin: 0.05
obstacle_num: 5
# Forward swept capsule (replaces previous symmetrically-inflated ellipse).
# At each prediction step k the obstacle is modelled as a line segment
# from p_obs(t_k) to p_obs(t_k) + tau_lookahead*v_obs, inflated by
# max(semi_major, semi_minor) plus collision margins. KF covariance from
# the upstream tracker (sigma2_*) further inflates the capsule:
#   capsule radius += uncertainty_alpha * sigma_perp(k)
#   capsule length += uncertainty_alpha * sigma_par(k)
# All planner-side; Obstacle.msg geometry and visualization stay geometric.
tau_lookahead: 1.0
# Below this speed the obstacle is treated as static (capsule degenerates
# to a point — pure circular footprint, no swept corridor).
dynamic_v_min: 0.1
# Multiplicative factor on KF 1-sigma covariance when inflating the capsule.
# 0.0 disables uncertainty inflation (recovers a pure geometric capsule).
# 1.0 inflates by 1-sigma; 2.0 by 2-sigma.
uncertainty_alpha: 1.0

# Visualize the exact swept capsules packed into MPC obs_params.
swept_capsule_vis_enable: true
swept_capsule_vis_stride: 8

# Costs (starter values)
w_goal_pos: 5.0
w_goal_yaw: 1.0
w_u: 0.1 # weight on control effort
w_du: 50 # weight on continuity of control
w_obs: 100.0
rho_slack: 5000.0

# Near-obstacle switching with hysteresis
near_dist_activate: 0.8
near_dist_release: 1.2
near_ttc_activate: 2.0
near_ttc_release: 3.5

# Topics
odom_topic: /odom
goal_topic: /move_base_simple/goal
obstacles_topic: /obstacles  # GT obstacles_topic: /obstaclesl; DOA obstacles_topic: /dynamic_obstacles
cmd_vel_topic: /cmd_vel

# Frames
odom_frame: odom
base_frame: base_footprint
