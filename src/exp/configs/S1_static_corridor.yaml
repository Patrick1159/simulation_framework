# Scene 1: Static Office Corridor (20m)
# Foundation scene for dynamic obstacle experiments.

corridor:
  length: 20.0
  width: 2.8
  wall_height: 2.5
  wall_thickness: 0.1

walls:
  left:
    center_y: -1.45
    segments:
      - name: left_wall_front
        length: 5.0
        x_span: [0.0, 5.0]
      - name: left_wall_mid
        length: 7.4
        x_span: [6.0, 13.4]
      - name: left_wall_back
        length: 5.4
        x_span: [14.6, 20.0]
  right:
    center_y: 1.45
    continuous: true
    name: right_wall
    length: 20.0
    x_span: [0.0, 20.0]

doorways:
  - id: 1
    gap_x: [5.0, 6.0]
    gap_center: 5.5
    clear_opening: 1.0
    left_post_x: 4.95
    right_post_x: 6.05
    top_x: 5.5
    post_size: [0.10, 0.15, 2.2]
    top_size: [1.2, 0.15, 0.12]
  - id: 2
    gap_x: [13.4, 14.6]
    gap_center: 14.0
    clear_opening: 1.0
    left_post_x: 13.45
    right_post_x: 14.55
    top_x: 14.0
    post_size: [0.10, 0.15, 2.2]
    top_size: [1.2, 0.15, 0.12]

