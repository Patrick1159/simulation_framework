scene:
  variant: corridor
  dynamic_scene_id: 1
  cylinders:
    count: 5
    speed_range: [0.2, 0.9]      # m/s, min/max
    speed_variance: 0.05
    motion_mode: wrap            # wrap | bounce
    spacing: 1.6                 # meters between cylinder rows along Y
    spawn_walls: false
  start_pose: {x: 0.0, y: 0.0, yaw: 0.0}
  goal_pose:  {x: 0.0, y: 8.0, yaw: 1.5708}   # +y direction; yaw matches robot's initial heading
runner:
  default_duration: 90
  warmup_sec: 5.0
  free_disk_min_gb: 5
  rosbag_topics:
    - /odom
    - /obstacles
    - /rematch/tracker_details
    - /tracker/dynamic_obstacles
    - /onboard_detector/dynamic_bboxes
    - /onboard_detector/tracked_bboxes
    - /states
    - /doa_obstacles
    - /doa_obstacles_tmpc
    - /cmd_vel
    - /mpc/pred_path
    - /mpc/status
    - /mpc/nav_path
    - /rematch_statistics_sam
    - /rematch_statistics_clip
    - /rematch_statistics_aggregator
    - /tf
    - /tf_static
